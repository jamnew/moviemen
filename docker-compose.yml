services:
  nginx:
    restart: unless-stopped
    image: nginx:1.30.7-alpine
    # no ports: section means it's not accessible from host but still accessible on http://moviemen:80
    # used to have 8080:80 here
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      app:
      nginx-shared:
        aliases:
          - moviemen # this is the internal hostname for Docker

  php:
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    environment:
      DB_HOST: mariadb
      DB_USER: ${MARIADB_USER}
      DB_PASSWORD: ${MARIADB_PASSWORD}
      DB_NAME: ${MARIADB_DATABASE}
      POSTERS_PATH: /var/www/html/storage/posters
      TEMP_PATH: /var/www/html/storage/tmp
      POSTERS_IMAGE_FORMAT: ${POSTERS_IMAGE_FORMAT:-jpg}
      READ_ONLY_MODE: ${READ_ONLY_MODE:-1}
    volumes:
      - ./:/var/www/html
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      app:

  mariadb:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./docker/mariadb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      app:

volumes:
  mariadb_data:

networks:
  app:
  nginx-shared:
    external: true
